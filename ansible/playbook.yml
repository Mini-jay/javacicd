
---
- name: Install K3s Kubernetes
  hosts: k3s_servers
  become: yes

  tasks:
    - name: Update package lists
      apt:
        update_cache: yes

    - name: Install curl
      apt:
        name: curl
        state: present

    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Check K3s service
      service:
        name: k3s
        state: started
        enabled: yes

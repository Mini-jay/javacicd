
name: Deploy to Azure Kubernetes

on:
  workflow_run:
    workflows: ["Java CI/CD Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Deploy new Docker image
        run: |
          sudo k3s kubectl set image deployment/javacicd-app javacicd-container=minijay1/javacicd-app:${{ github.event.workflow_run.head_sha }}
          sudo k3s kubectl rollout status deployment/javacicd-app --timeout=180s

      - name: Verify deployment
        run: |
          sudo k3s kubectl get deployments,pods,services
